[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcraft_gui"
version = "0.1.0"
description = "RTS-style autonomous unit simulator GUI"
authors = [
  { name = "Edwin Reidlo" }
]
dependencies = [
  "PyQt5>=5.15.0"
]
requires-python = ">=3.7"

[project.scripts]
rcraft-gui = "rcraft_gui.main:main"
